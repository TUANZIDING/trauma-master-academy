<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">HOSPITAL MASS-CASUALTY RESPONSE FLOW</title>
  <desc id="desc">Teaching flow for hospital casualty arrival, sorting, resuscitation areas, operating capacity, wards, and transfer without local activation criteria.</desc>
  <rect width="1200" height="760" fill="#fbf7ef"/>
  <text x="62" y="86" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#102033">HOSPITAL MASS-CASUALTY RESPONSE FLOW</text>
  <text x="64" y="124" font-family="Arial, sans-serif" font-size="20" fill="#64748b">A classroom map for patient flow and communication nodes</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="235" width="180" height="112" rx="14" fill="#fff" stroke="#1f7a7e" stroke-width="4"/>
    <text x="100" y="280" font-size="21" font-weight="800" fill="#1f7a7e">ARRIVAL</text>
    <text x="100" y="314" font-size="16" fill="#475569">Pre-alert / handoff</text>
    <rect x="320" y="235" width="180" height="112" rx="14" fill="#fff" stroke="#1f7a7e" stroke-width="4"/>
    <text x="350" y="280" font-size="21" font-weight="800" fill="#1f7a7e">SORTING</text>
    <text x="350" y="314" font-size="16" fill="#475569">Teaching categories</text>
    <rect x="570" y="160" width="190" height="112" rx="14" fill="#fff" stroke="#102033" stroke-width="4"/>
    <text x="600" y="205" font-size="21" font-weight="800" fill="#102033">RESUS BAY</text>
    <text x="600" y="239" font-size="16" fill="#475569">Immediate attention</text>
    <rect x="570" y="310" width="190" height="112" rx="14" fill="#fff" stroke="#102033" stroke-width="4"/>
    <text x="600" y="355" font-size="21" font-weight="800" fill="#102033">MONITORED</text>
    <text x="600" y="389" font-size="16" fill="#475569">Ongoing reassessment</text>
    <rect x="830" y="160" width="190" height="112" rx="14" fill="#fff" stroke="#9b1c1f" stroke-width="4"/>
    <text x="860" y="205" font-size="21" font-weight="800" fill="#9b1c1f">OR / IR</text>
    <text x="860" y="239" font-size="16" fill="#475569">Capacity discussion</text>
    <rect x="830" y="310" width="190" height="112" rx="14" fill="#fff" stroke="#9b1c1f" stroke-width="4"/>
    <text x="860" y="355" font-size="21" font-weight="800" fill="#9b1c1f">ICU / WARD</text>
    <text x="860" y="389" font-size="16" fill="#475569">Downstream beds</text>
    <rect x="570" y="505" width="450" height="96" rx="14" fill="#eef8f5" stroke="#b8d8d2" stroke-width="3"/>
    <text x="600" y="548" font-size="22" font-weight="800" fill="#1f7a7e">TRANSFER / DISTRIBUTION</text>
    <text x="600" y="580" font-size="16" fill="#475569">Communication with regional partners</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 291 H318"/>
    <path d="M500 291 C540 291 540 216 568 216"/>
    <path d="M500 291 C540 291 540 366 568 366"/>
    <path d="M760 216 H828"/>
    <path d="M760 366 H828"/>
    <path d="M665 423 V503"/>
    <path d="M925 423 V503"/>
  </g>
  <text x="74" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#102033">Flow must remain dynamic: patient priority and system capacity are reassessed repeatedly.</text>
</svg>
